<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fication - Expanded Connections Directory</title>
    <link rel="stylesheet" href="/static/network/style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Top App Header -->
        <header class="app-header">
            <h1>FICATION</h1>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Sticky Header Section (Search & Tabs) -->
            <div class="sticky-header">
                <!-- Search Bar -->
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Search connections by name, title, or city...">
                </div>

                <!-- Filter Tabs -->
                <div class="filter-tabs">
                    <button class="tab-btn active" data-filter="all">ALL (<span id="countAll">0</span>)</button>
                    <button class="tab-btn" data-filter="formal">FORMAL (<span id="countFormal">0</span>)</button>
                    <button class="tab-btn" data-filter="social">SOCIAL (<span id="countSocial">0</span>)</button>
                </div>
            </div>

            <!-- Directory Cards List (Dynamically populated via JavaScript for loop) -->
            <div class="directory-list" id="directoryList">
                <!-- Rendered dynamically -->
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a href="/" class="nav-item">
                <i class="fa-solid fa-expand"></i>
                <span>SCAN</span>
            </a>
            <a href="/network" class="nav-item active">
                <i class="fa-solid fa-network-wired"></i>
                <span>NETWORK</span>
            </a>
            <a href="/formal_cards" class="nav-item">
                <i class="fa-solid fa-id-card"></i>
                <span>MY CARDS</span>
            </a>
            <a href="/social_cards" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>MY PROFILE</span>
            </a>
        </nav>
    </div>

    <script src="/static/network/script.js"></script>
</body>
</html>
