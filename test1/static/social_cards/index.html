<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Profile</title>
    <link rel="stylesheet" href="/static/social_cards/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Main Scrollable Content -->
        <main class="content-scroll">
            <div class="brand-row">
                <span class="brand-title">FICATION</span>
                <span class="formal-badge"><span class="dot"></span> INFORMAL PROFILE</span>
            </div>

            <!-- Hero Image Profile Card -->
            <div class="hero-card">
                <div class="hero-image-container">
                    <span class="badge-social-id">SOCIAL ID</span>
                    <span class="badge-active"><span class="green-dot"></span> ACTIVE</span>
                    <img id="profileAvatar" src="" alt="Profile Photo">
                </div>
                <div class="hero-info">
                    <h2 id="profileName">--</h2>
                    <p id="profileLocation" class="location-text"><i class="fa-solid fa-location-dot"></i> --</p>
                </div>
            </div>

            <!-- Dynamic Prompt Boxes -->
            <div class="info-box">
                <h3>"MY GREATEST STRENGTH"</h3>
                <p id="boxStrength">Loading...</p>
            </div>

            <div class="info-box">
                <h3>"DATING ME IS LIKE"</h3>
                <p id="boxDating">Loading...</p>
            </div>

            <div class="info-box">
                <h3>"A LIFE GOAL OF MINE"</h3>
                <p id="boxGoal">Loading...</p>
            </div>

            <div class="info-box">
                <h3>"THE KEY TO MY HEART"</h3>
                <p id="boxHeart">Loading...</p>
            </div>
        </main>

        <!-- Bottom Navigation Bar matching your screenshot -->
        <nav class="bottom-nav">
            <a href="/" class="nav-item">
                <i class="fa-solid fa-expand"></i>
                <span>SCAN</span>
            </a>
            <a href="/network" class="nav-item">
                <i class="fa-solid fa-users"></i>
                <span>NETWORK</span>
            </a>
            <a href="/formal_cards" class="nav-item">
                <i class="fa-solid fa-id-card"></i>
                <span>MY CARDS</span>
            </a>
            <a href="/social_cards" class="nav-item active">
                <i class="fa-solid fa-user"></i>
                <span>MY PROFILE</span>
            </a>
        </nav>
    </div>

    <script src="/static/social_cards/script.js"></script>
</body>
</html>
